<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // Signal Lost — Ahmed Walid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#030305">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23030305'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23a1a1aa' font-family='monospace' font-size='13' font-weight='bold'>AW</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030305;
      color: #f4f4f7;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .wrap { max-width: 520px; }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.08);
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }
    .title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: #a1a1aa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .desc {
      font-size: 1.05rem;
      color: #8b8b99;
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      transition: all 0.2s ease;
    }
    .back:hover {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="title">Signal Lost</div>
    <p class="desc">
      You've gone somewhere that doesn't exist yet.<br>
      But if you're building something that should &mdash; reach out.
    </p>
    <a href="/" class="back">&larr; Return to Base</a>
  </div>
</body>
</html>
